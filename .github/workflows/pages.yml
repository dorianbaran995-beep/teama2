name: Deploy Team A to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply Team A login visibility fix
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) CSS hard fallback: [hidden] must always win over the login's display:grid!important.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style>'
          fix = '<style>\n    #lockScreen[hidden]{display:none!important}\n'
          if '#lockScreen[hidden]{display:none!important}' not in s:
              s = s.replace(marker, fix, 1)
          p.write_text(s, encoding='utf-8')

          # 2) JavaScript hard fallback: physically remove the login from layout after a valid password.
          j = Path('app.js')
          a = j.read_text(encoding='utf-8')
          a = a.replace(
              "lockScreen.hidden=true;\n    appRoot.hidden=false;",
              "lockScreen.hidden=true;\n    lockScreen.style.setProperty('display','none','important');\n    appRoot.hidden=false;"
          )
          a = a.replace(
              "appRoot.hidden=true;lockScreen.hidden=false;$('teamPassword').value='';",
              "appRoot.hidden=true;lockScreen.hidden=false;lockScreen.style.removeProperty('display');$('teamPassword').value='';"
          )
          j.write_text(a, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
