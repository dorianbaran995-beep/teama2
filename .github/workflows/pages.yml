name: Deploy Team A to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply deterministic Team A login fix
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          hard_rule = '<style id="team-a-visibility-fix">html body #lockScreen[hidden]{display:none!important}html body #appRoot[hidden]{display:none!important}</style>'
          if 'team-a-visibility-fix' not in html:
              html = html.replace('</head>', hard_rule + '\n</head>', 1)
          index.write_text(html, encoding='utf-8')

          app = Path('app.js')
          js = app.read_text(encoding='utf-8')
          js = js.replace(
              'lockScreen.hidden=true;\n    appRoot.hidden=false;',
              "lockScreen.hidden=true;\n    lockScreen.style.setProperty('display','none','important');\n    appRoot.hidden=false;\n    appRoot.style.removeProperty('display');"
          )
          js = js.replace(
              "appRoot.hidden=true;lockScreen.hidden=false;$('teamPassword').value='';",
              "appRoot.hidden=true;appRoot.style.setProperty('display','none','important');lockScreen.hidden=false;lockScreen.style.removeProperty('display');$('teamPassword').value='';"
          )
          app.write_text(js, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
